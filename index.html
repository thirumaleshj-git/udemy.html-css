<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-image:
        url('library.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #222;
        }

        /* Navbar */
        .navbar {
            height: 65px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 30px;
            font-weight: bold ;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #000;
        }

        .dashboard-btn {
            text-decoration: none;
            background: #222;
            color: white;
            padding: 10px 18px;
            border-radius: 6px;
        }

        /* Hero */
        .hero {
            min-height: calc(100vh - 65px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 20px;
        }

        .hero p {
            color: #f5f3f3;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .hero-btn {
            display: inline-block;
            background: #010101;
            color: white;
            padding: 13px 25px;
            border-radius: 6px;
            text-decoration: none;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .navbar {
                padding: 0 20px;
            }

            .nav-links {
                display: none;
            }

            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            FreshLib

        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="#">Books</a></li>
            <li><a href="#">Members</a></li>
            <li><a href="#">Reports</a></li>
        </ul>

        <a href="dashboard.html" class="dashboard-btn">
            Dashboard
        </a>

    </nav>

    <section class="hero">

        <div class="hero-content">

            <h1>Library Management System</h1>

            <p>
                A simple and modern system to manage your
                library books, members, issues and returns.
            </p>

            <a href="dashboard.html" class="hero-btn">
                Open Dashboard
            </a>

        </div>

    </section>

</body>
</html>
